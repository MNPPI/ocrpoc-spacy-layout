name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Public Quality
    uses: MNPPI/.github/.github/workflows/public-quality.yml@6af4f04a0b2d22f9a87eb52e0b7cf146acbecc99
    with:
      profile: python
