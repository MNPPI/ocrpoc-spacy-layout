name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Public Quality
    uses: MNPPI/.github/.github/workflows/public-quality.yml@3430f2fc465aece10e19501a39d7f949c5acb096
    with:
      profile: python
